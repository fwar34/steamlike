# Gradle JVM 参数：构建进程最大堆内存 2048MB，并指定文件编码为 UTF-8（避免中文乱码）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 使用 AndroidX 库（替代旧 support 库），AGP 要求必须为 true
android.useAndroidX=true
# Kotlin 代码风格使用官方风格（命名/缩进规范）
kotlin.code.style=official
# 非传递 R 类：每个模块只生成/引用自己的 R 类（加速构建、减小 APK 体积）
android.nonTransitiveRClass=true
# 关闭 IDE 自动下载源码：构建时不再拉取依赖的源码 jar
systemProp.ides.downloadSources=false

# HTTP/HTTPS 代理设置（使用系统代理 127.0.0.1:7897）
# 系统属性：HTTP 代理主机地址
systemProp.http.proxyHost=127.0.0.1
# 系统属性：HTTP 代理端口
systemProp.http.proxyPort=7897
# 系统属性：HTTPS 代理主机地址
systemProp.https.proxyHost=127.0.0.1
# 系统属性：HTTPS 代理端口
systemProp.https.proxyPort=7897
# 不走代理的主机列表（本地地址与国内镜像直连，避免代理干扰）
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.tencent.com
